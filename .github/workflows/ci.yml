name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q --cov=agent --cov-fail-under=80  # starts a Temporal dev server (downloaded on first use)
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make compose-check
      - run: docker build -t tws-harness:ci .
      - name: boot the stack and check it is healthy (scripted model, dummy token, no GitHub calls)
        run: |
          mkdir -p .secrets && printf dummy > .secrets/github_token
          printf 'DEMO_REPO=o/r\nLLM_BACKEND=scripted\nCODEC_KEY=%s\n' "$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" > .env
          docker compose -f docker-compose.yml up -d --wait temporal auth api
          curl -fsS http://localhost:8080/ping
          curl -fsS http://localhost:8080/config.json
          docker compose logs --no-color | tail -20
