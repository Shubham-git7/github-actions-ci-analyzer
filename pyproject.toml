[project]
name = "ci-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.3",
    "cryptography>=50.0.2",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "langchain-aws>=1.9.3",
    "langchain-core>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-aws>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E701", "E702", "E731", "E741"]
"scripts/*" = ["S", "E402"]
"infra/bff/*" = ["S310"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
